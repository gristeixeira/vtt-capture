name: Extension tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for file in background.js content.js popup.js lib/*.js; do node --check "$file"; done
      - name: Run unit and simulated integration tests
        run: node --test tests/*.mjs
